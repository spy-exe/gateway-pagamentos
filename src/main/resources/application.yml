spring:
  application:
    name: gateway-pagamentos
  datasource:
    url: jdbc:h2:mem:gateway;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

gateway:
  jwt:
    segredo: ${GATEWAY_JWT_SEGREDO:segredo-de-desenvolvimento-nao-usar-fora-da-maquina-local-0123456789}
    validade-minutos: 120
  autorizacao:
    limite-por-transacao-em-centavos: 1000000

logging:
  level:
    br.com.ricardofigueiredo.gateway: INFO
